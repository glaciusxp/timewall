name: Release TimeWall Free APK to website

on:
  push:
    tags:
      - 'site-v*'

permissions:
  contents: read

concurrency:
  group: timewall-website-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: website-release
    timeout-minutes: 25
    steps:
      - name: Check out the tagged app revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse the release tag
        id: tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^site-v([0-9]+([.][0-9]+)+)(-test)?$ ]]; then
            echo "::error::Use site-vVERSION or site-vVERSION-test."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "test_suffix=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Build the signed website APK
        shell: bash
        env:
          TIMEWALL_KEYSTORE_BASE64: ${{ secrets.TIMEWALL_KEYSTORE_BASE64 }}
          TIMEWALL_STORE_PASSWORD: ${{ secrets.TIMEWALL_STORE_PASSWORD }}
          TIMEWALL_KEY_ALIAS: ${{ secrets.TIMEWALL_KEY_ALIAS }}
          TIMEWALL_KEY_PASSWORD: ${{ secrets.TIMEWALL_KEY_PASSWORD }}
        run: |
          : "${TIMEWALL_KEYSTORE_BASE64:?Missing keystore secret}"
          : "${TIMEWALL_STORE_PASSWORD:?Missing store password}"
          : "${TIMEWALL_KEY_ALIAS:?Missing key alias}"
          : "${TIMEWALL_KEY_PASSWORD:?Missing key password}"
          umask 077
          TIMEWALL_KEYSTORE="$(mktemp "$RUNNER_TEMP/timewall.XXXXXXXX")"
          export TIMEWALL_KEYSTORE
          trap 'rm -f -- "$TIMEWALL_KEYSTORE"' EXIT
          printf '%s' "$TIMEWALL_KEYSTORE_BASE64" | base64 --decode > "$TIMEWALL_KEYSTORE"
          unset TIMEWALL_KEYSTORE_BASE64
          bash timewall-app/gradlew -p timewall-app --no-daemon --console=plain assembleSiteFreeWebsite

      - name: Verify APK metadata and signing certificate
        id: apk
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
          APK: timewall-app/build/outputs/apk/siteFree/website/timewall-app-siteFree-website.apk
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --min-sdk-version 19 --verbose --print-certs "$APK" > "$RUNNER_TEMP/timewall-signature.txt"
          grep -Fx 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/timewall-signature.txt"
          grep -Fx 'Signer #1 certificate SHA-256 digest: e551301548a544d10742ba78a25ee9db760f9ae31ccc2241618c359da8ebcfb6' "$RUNNER_TEMP/timewall-signature.txt"
          grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/timewall-signature.txt"
          "$tools/aapt" dump badging "$APK" > "$RUNNER_TEMP/timewall-badging.txt"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re

          lines = (Path(os.environ["RUNNER_TEMP"]) / "timewall-badging.txt").read_text(encoding="utf-8").splitlines()
          package = next((line for line in lines if line.startswith("package: ")), "")
          fields = dict(re.findall(r"(\w+)='([^']*)'", package))
          if fields.get("name") != "it.timewall.dashboard.sitefree":
              raise SystemExit("Unexpected website APK application ID")
          if fields.get("versionName") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("APK versionName does not match the release tag")
          build = int(fields["versionCode"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"build={build}", file=output)
          print(f"Verified TimeWall Free {fields['versionName']} (build {build})")
          PYTHON

      - name: Finish the build-only test
        if: steps.tag.outputs.test_suffix == '-test'
        run: echo "Build and signature verified. Website publication skipped."

      - name: Check out the website
        if: steps.tag.outputs.test_suffix == ''
        uses: actions/checkout@v4
        with:
          repository: glaciusxp/timewall-website
          ref: main
          token: ${{ secrets.WEBSITE_PUSH_TOKEN }}
          path: website

      - name: Update and push the website download
        if: steps.tag.outputs.test_suffix == ''
        shell: bash
        working-directory: website
        env:
          APK_VERSION: ${{ steps.tag.outputs.version }}
          APK_BUILD: ${{ steps.apk.outputs.build }}
          APK_FILE: ../timewall-app/build/outputs/apk/siteFree/website/timewall-app-siteFree-website.apk
        run: |
          export RELEASE_DATE="$(TZ=Europe/Rome date +%F)"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil

          path = Path("release.json")
          release = json.loads(path.read_text(encoding="utf-8"))
          build = int(os.environ["APK_BUILD"])
          if build <= int(release["build"]):
              raise SystemExit("APK versionCode must be greater than the published build")
          destination = Path("public/downloads/TimeWall-Dashboard.apk")
          if release["apk_source"] != destination.as_posix():
              raise SystemExit("Unexpected website APK destination")
          shutil.copyfile(os.environ["APK_FILE"], destination)
          release.update(version=os.environ["APK_VERSION"], build=build,
                         release_date=os.environ["RELEASE_DATE"])
          path.write_text(json.dumps(release, indent=2) + "\n", encoding="utf-8")
          PYTHON
          python3 -X utf8 build.py
          git config user.name "TimeWall Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- release.json public/downloads/TimeWall-Dashboard.apk
          git commit -m "release: publish TimeWall Free $APK_VERSION (build $APK_BUILD)"
          git push origin HEAD:main
