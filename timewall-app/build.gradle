plugins { id 'com.android.application' version '9.4.1' }

android {
    // Pure Java app: do not package the Kotlin standard library implicitly added by AGP 9.
    enableKotlin = false
    namespace 'it.timewall.app'
    compileSdk { version = release(37) { minorApiLevel = 0 } }
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'it.timewall.dashboard'
        minSdk 19
        targetSdk 36
        versionCode 102
        versionName '0.102'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    androidResources { noCompress += ['ttf', 'otf'] }
    signingConfigs {
        release {
            storeFile file(providers.environmentVariable('TIMEWALL_KEYSTORE').getOrElse('.signing/timewall.jks'))
            storePassword providers.environmentVariable('TIMEWALL_STORE_PASSWORD').getOrElse('android')
            keyAlias providers.environmentVariable('TIMEWALL_KEY_ALIAS').getOrElse('androiddebugkey')
            keyPassword providers.environmentVariable('TIMEWALL_KEY_PASSWORD').getOrElse('android')
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildFeatures { buildConfig = true }
    flavorDimensions += 'edition'
    productFlavors {
        complete {
            dimension 'edition'
            buildConfigField 'int', 'CALENDAR_LIMIT', '20'
            buildConfigField 'boolean', 'FREE', 'false'
            buildConfigField 'boolean', 'PLAY_PREVIEW', 'false'
        }
        playFree {
            dimension 'edition'
            buildConfigField 'int', 'CALENDAR_LIMIT', '1'
            applicationIdSuffix '.playfree'
            buildConfigField 'boolean', 'FREE', 'true'
            buildConfigField 'boolean', 'PLAY_PREVIEW', 'true'
        }
        siteFree {
            dimension 'edition'
            buildConfigField 'int', 'CALENDAR_LIMIT', '1'
            applicationIdSuffix '.sitefree'
            buildConfigField 'boolean', 'FREE', 'true'
            buildConfigField 'boolean', 'PLAY_PREVIEW', 'false'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        website {
            initWith release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    testOptions { unitTests.returnDefaultValues = false }
    lint { abortOnError true; sarifReport = false; disable 'ExpiredTargetSdkVersion', 'OldTargetApi', 'GradleDependency', 'ObsoleteSdkInt' }
}
androidComponents {
    beforeVariants(selector().withBuildType('website')) { variant ->
        variant.enable = variant.productFlavors.any { it.second == 'siteFree' }
    }
    beforeVariants(selector().withBuildType('release')) { variant ->
        if (variant.productFlavors.any { it.second == 'siteFree' }) variant.enable = false
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

dependencyLocking { lockAllConfigurations() }

configurations { javaFormatter { transitive = false } }
dependencies { javaFormatter 'com.google.googlejavaformat:google-java-format:1.24.0:all-deps' }
// Formatting is an opt-in mutation; check only reports differences.
['formatJava': false, 'checkJavaFormat': true].each { taskName, checkOnly ->
    tasks.register(taskName, Exec) {
        group = 'verification'
        description = checkOnly ? 'Verify AOSP Java formatting' : 'Apply AOSP Java formatting'
        doFirst {
            def args = ["${System.getProperty('java.home')}/bin/java", '-jar',
                configurations.javaFormatter.singleFile.absolutePath, '--aosp']
            args += checkOnly ? ['--dry-run', '--set-exit-if-changed'] : ['--replace']
            args += fileTree('src').matching { include '**/*.java' }.files.collect { it.absolutePath }.sort()
            commandLine args
        }
    }
}
tasks.named('check') { dependsOn 'checkJavaFormat' }
